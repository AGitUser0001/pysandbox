[workspace]
members = [
    "rust/pysandbox-protocol",
    "rust/pysandbox-sandboxd",
    "rust/pysandbox-native",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
futures-util = "0.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wasmtime = "46.0.1"
wasmtime-wasi = { version = "46.0.1", features = ["p3"] }
