[workspace]
members = [
    "rust/pysandbox-protocol",
    "rust/pysandbox-runtime-build",
    "rust/pysandbox-sandboxd",
    "rust/pysandbox-native",
    "vendor/eryx-vfs",
]
exclude = ["vendor/cbor2"]
resolver = "3"

[profile.release]
strip = true

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
cbor2 = { version = "=1.1.4", features = ["tokio"] }
futures-util = "0.3"
interprocess = { version = "2.4.2", features = ["tokio"] }
pyo3 = { version = "0.29.0", features = [
    "extension-module",
    "generate-import-lib",
] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"
wasmtime = "47.0.3"
wasmtime-wasi = { version = "47.0.3", features = ["p3"] }
