# Generated with maturin v1.14.1, then customized for pysandbox.
# Regenerate a new base for comparison with:
#
#   maturin generate-ci github \
#     --manifest-path rust/pysandbox-native/Cargo.toml \
#     -o /tmp/pysandbox-CI.yml

name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build and lint dependencies
        run: python -m pip install componentize-py ruff
      - name: Check Python types
        run: npx pyright
      - name: Lint Python
        run: ruff check .
      - name: Check formatting
        run: |
          ruff format --check .
          cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace

  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --find-interpreter
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: "2_28"
          before-script-linux: uv tool install componentize-py
      - name: Install wheel
        if: ${{ matrix.target == 'x86_64' }}
        run: |
          python -m pip install cbor2
          python -m pip install --no-index --no-deps --find-links dist pysandbox
      - name: Test installed wheel
        if: ${{ matrix.target == 'x86_64' }}
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install componentize-py
        run: python -m pip install componentize-py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: >-
            --release
            --out dist
            --find-interpreter
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install wheel
        run: |
          python -m pip install cbor2
          python -m pip install --no-index --no-deps --find-links dist pysandbox
      - name: Test installed wheel
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install componentize-py
        run: python -m pip install componentize-py
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --find-interpreter
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Install wheel
        run: |
          python -m pip install cbor2
          python -m pip install --no-index --no-deps --find-links dist pysandbox
      - name: Test installed wheel
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist
            --manifest-path rust/pysandbox-native/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs:
      - linux
      - windows
      - macos
      - sdist
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "wheels-*/*"
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true' }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true' }}
        run: uv publish --trusted-publishing always "wheels-*/*"
