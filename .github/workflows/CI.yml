# Generated with maturin v1.14.1, then customized for pysandbox.
# Regenerate a new base for comparison with:
#
#   maturin generate-ci github \
#     --manifest-path rust/pysandbox-native/Cargo.toml \
#     -o /tmp/pysandbox-CI.yml

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build and lint dependencies
        run: uv sync --group dev --no-install-project
      - name: Check Python types
        run: npx pyright
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: |
          uv run --no-sync ruff format --check .
          cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  runtime:
    name: Component runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install componentize-py
        run: python -m pip install componentize-py
      - name: Generate component runtime
        run: >-
          cargo run
          --release
          --package pysandbox-runtime-build
          --
          target/pysandbox-runtime
      - name: Upload component runtime
        uses: actions/upload-artifact@v6
        with:
          name: component-runtime
          path: target/pysandbox-runtime

  linux:
    needs: runtime
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: component-runtime
          path: .pysandbox-runtime
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --find-interpreter
            --no-default-features
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: true
          manylinux: "2_28"
          docker-options: -e PYSANDBOX_PREBUILT_RUNTIME=.pysandbox-runtime
      - name: Install wheel
        if: ${{ matrix.target == 'x86_64' }}
        run: python -m pip install --find-links dist pysandbox
      - name: Test installed wheel
        if: ${{ matrix.target == 'x86_64' }}
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    needs: runtime
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x64
          - aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
      - uses: actions/download-artifact@v7
        with:
          name: component-runtime
          path: .pysandbox-runtime
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYSANDBOX_PREBUILT_RUNTIME: .pysandbox-runtime
        with:
          target: ${{ matrix.target }}
          args: >-
            --release
            --out dist
            --find-interpreter
            --no-default-features
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: true
      - name: Install wheel
        if: ${{ matrix.target == 'x64' }}
        run: python -m pip install --find-links dist pysandbox
      - name: Test installed wheel
        if: ${{ matrix.target == 'x64' }}
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    needs: runtime
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: component-runtime
          path: .pysandbox-runtime
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          PYSANDBOX_PREBUILT_RUNTIME: .pysandbox-runtime
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --find-interpreter
            --no-default-features
            --manifest-path rust/pysandbox-native/Cargo.toml
          sccache: true
      - name: Install wheel
        run: python -m pip install --find-links dist pysandbox
      - name: Test installed wheel
        working-directory: tests
        run: python -m unittest discover -v
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist
            --manifest-path rust/pysandbox-native/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    needs:
      - linux
      - windows
      - macos
      - sdist
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Package component runtime
        env:
          RUNTIME_ARCHIVE: pysandbox-component-runtime-${{ github.event.release.tag_name }}.tar.gz
        run: tar -C component-runtime -czf "$RUNTIME_ARCHIVE" .
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            wheels-*/*
            pysandbox-component-runtime-*.tar.gz
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUNTIME_ARCHIVE: pysandbox-component-runtime-${{ github.event.release.tag_name }}.tar.gz
        run: gh release upload "$RELEASE_TAG" wheels-*/* "$RUNTIME_ARCHIVE" --clobber
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always "wheels-*/*"
