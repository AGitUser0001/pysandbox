# Generated with maturin v1.14.1, then customized for pysandbox.
# Regenerate a new base for comparison with:
#
#   maturin generate-ci github \
#     --manifest-path rust/pysandbox-native/Cargo.toml \
#     -o /tmp/pysandbox-CI.yml

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_tag == '' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build and lint dependencies
        run: uv sync --group dev --no-install-project
      - name: Check Python types
        run: npx pyright
      - name: Lint Python
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: |
          uv run --no-sync ruff format --check .
          cargo fmt --all -- --check
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  runtime:
    name: Component runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install componentize-py
        run: python -m pip install componentize-py
      - name: Generate component runtime
        run: >-
          cargo run
          --release
          --package pysandbox-runtime-build
          --
          target/pysandbox-runtime
      - name: Upload component runtime
        uses: actions/upload-artifact@v6
        with:
          name: component-runtime
          path: target/pysandbox-runtime

  wheels:
    name: Build ${{ matrix.platform.name }} wheels
    needs: runtime
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            zig: true
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            zig: true
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            zig: false
          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
            manylinux: "off"
            zig: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13
            3.14
            3.14t
            3.15
            3.15t
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheels-${{ matrix.platform.name }}
      - name: Install Windows cross-compilation tools
        if: startsWith(matrix.platform.name, 'windows-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          command -v llvm-lib
      - uses: actions/download-artifact@v7
        with:
          name: component-runtime
          path: .pysandbox-runtime
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_USE_XWIN: ${{ startsWith(matrix.platform.name, 'windows-') && '1' || '' }}
          PYSANDBOX_PREBUILT_RUNTIME: .pysandbox-runtime
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter
            python3.12
            python3.13
            python3.14
            python3.14t
            python3.15
            python3.15t
            ${{ matrix.platform.zig && '--zig' || '' }}
            --no-default-features
            --manifest-path rust/pysandbox-native/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux }}
      - name: Verify free-threaded wheels
        run: |
          for abi in cp314-cp314t cp315-cp315t; do
            if ! compgen -G "dist/*-${abi}-*.whl" >/dev/null; then
              echo "::error::Maturin did not build a ${abi} wheel"
              exit 1
            fi
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  # Build both Apple targets on the faster ARM runner, which has the macOS SDK
  # needed to cross-link the Intel wheel.
  macos-wheels:
    name: Build ${{ matrix.platform.name }} wheels
    needs: runtime
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-x86_64
            target: x86_64
            deployment-target: "10.12"
          - name: macos-aarch64
            target: aarch64
            deployment-target: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.13
            3.14
            3.14t
            3.15
            3.15t
          allow-prereleases: true
      - name: Find Python interpreters
        id: python
        run: >-
          python .github/scripts/find_python_interpreters.py
          python312 python313 python314 python314t python315 python315t
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheels-${{ matrix.platform.name }}
      - uses: actions/download-artifact@v7
        with:
          name: component-runtime
          path: .pysandbox-runtime
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment-target }}
          PYSANDBOX_PREBUILT_RUNTIME: .pysandbox-runtime
        with:
          target: ${{ matrix.platform.target }}
          args: >-
            --release
            --out dist
            --interpreter
            '${{ steps.python.outputs.python312 }}'
            '${{ steps.python.outputs.python313 }}'
            '${{ steps.python.outputs.python314 }}'
            '${{ steps.python.outputs.python314t }}'
            '${{ steps.python.outputs.python315 }}'
            '${{ steps.python.outputs.python315t }}'
            --no-default-features
            --manifest-path rust/pysandbox-native/Cargo.toml
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  test-wheels:
    name: Test ${{ matrix.platform.label }} wheels
    needs:
      - wheels
      - macos-wheels
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            label: linux-x86_64
            runner: ubuntu-22.04
            architecture: x64
            python-versions: "3.12\n3.14t"
            regular: true
            freethreaded: true
          - name: linux-aarch64
            label: linux-aarch64
            runner: ubuntu-22.04-arm
            architecture: arm64
            python-versions: "3.12\n3.14t"
            regular: true
            freethreaded: true
          - name: windows-x64
            label: windows-x64
            runner: windows-latest
            architecture: x64
            python-versions: "3.12\n3.14t"
            regular: true
            freethreaded: true
          - name: windows-aarch64
            label: windows-aarch64
            runner: windows-11-arm
            architecture: arm64
            python-versions: "3.12\n3.14t"
            regular: true
            freethreaded: true
          - name: macos-x86_64
            label: macos-x86_64 (regular)
            runner: macos-26-intel
            architecture: x64
            python-versions: "3.12"
            regular: true
            freethreaded: false
          - name: macos-x86_64
            label: macos-x86_64 (free-threaded)
            runner: macos-26-intel
            architecture: x64
            python-versions: "3.14t"
            regular: false
            freethreaded: true
          - name: macos-aarch64
            label: macos-aarch64
            runner: macos-latest
            architecture: arm64
            python-versions: "3.12\n3.14t"
            regular: true
            freethreaded: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python-versions }}
          architecture: ${{ matrix.platform.architecture }}
          allow-prereleases: true
      - name: Find Python 3.12
        if: matrix.platform.regular
        id: python312
        run: >-
          python .github/scripts/find_python_interpreters.py
          python312
      - name: Find free-threaded Python
        if: matrix.platform.freethreaded
        id: python314t
        run: >-
          python .github/scripts/find_python_interpreters.py
          python314t
      - uses: actions/download-artifact@v7
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - name: Install wheel
        if: matrix.platform.regular
        shell: bash
        run: >-
          '${{ steps.python312.outputs.python312 }}'
          -m pip install --pre --find-links dist
          pysandbox-wasi pytest pytest-asyncio pytest-timeout pytest-xdist
      - name: Test installed wheel
        if: matrix.platform.regular
        working-directory: tests
        shell: bash
        run: >-
          '${{ steps.python312.outputs.python312 }}'
          -m pytest -n auto --dist worksteal .
      - name: Install free-threaded wheel
        if: matrix.platform.freethreaded
        shell: bash
        run: >-
          '${{ steps.python314t.outputs.python314t }}'
          -m pip install --pre --find-links dist
          pysandbox-wasi pytest pytest-asyncio pytest-timeout pytest-xdist
      - name: Test free-threaded wheel
        if: matrix.platform.freethreaded
        working-directory: tests
        shell: bash
        run: >-
          '${{ steps.python314t.outputs.python314t }}'
          -c 'import sys, pysandbox; assert not sys._is_gil_enabled()'
          &&
          '${{ steps.python314t.outputs.python314t }}'
          -m pytest -n auto --dist worksteal .

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: >-
            --out dist
            --manifest-path rust/pysandbox-native/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
    needs:
      - test-wheels
      - sdist
    environment: release
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Package component runtime
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: tar -C component-runtime -czf "pysandbox-component-runtime-$RELEASE_TAG.tar.gz" .
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            wheels-*/*
            pysandbox-component-runtime-*.tar.gz
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RUNTIME_ARCHIVE: pysandbox-component-runtime-${{ github.event.release.tag_name || inputs.release_tag }}.tar.gz
        run: gh release upload "$RELEASE_TAG" wheels-*/* "$RUNTIME_ARCHIVE" --clobber
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always "wheels-*/*"
