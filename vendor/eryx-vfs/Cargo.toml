[package]
name = "eryx-vfs"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Vendored WASI filesystem bindings used by pysandbox"
publish = false

[build-dependencies]
wasmparser = "0.258"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bitflags = "2"
bytes = "1"
cap-fs-ext = "4"
cap-std = "4"
fs-set-times = "0.20"
thiserror = "2"
tokio = { version = "1", features = ["full", "sync"] }
tracing = "0.1"
wasmtime = { version = "48.0.3", features = ["component-model", "async"] }
wasmtime-wasi = "48.0.3"
wasmtime-wasi-io = "48.0.3"
