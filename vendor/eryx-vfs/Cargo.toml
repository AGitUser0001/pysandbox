[package]
name = "eryx-vfs"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Vendored WASI filesystem bindings used by pysandbox"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
cap-fs-ext = "4"
cap-std = "4"
fs-set-times = "0.20"
thiserror = "2"
tokio = { version = "1", features = ["full", "sync"] }
tracing = "0.1"
wasmtime = { version = "47.0.2", features = ["component-model", "async"] }
wasmtime-wasi = "47.0.2"
wasmtime-wasi-io = "47.0.2"
