[project]
name = "pysandbox-wasi-core"
version = "1.6.6"
description = "Native Wasmtime extension for pysandbox-wasi."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "t8945", email = "123198477+AGitUser0001@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["sandbox", "python", "wasm", "wasi", "wasmtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AGitUser0001/pysandbox"
Repository = "https://github.com/AGitUser0001/pysandbox"
Issues = "https://github.com/AGitUser0001/pysandbox/issues"

[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "pysandbox_core"
