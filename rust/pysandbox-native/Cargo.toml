[package]
name = "pysandbox-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Stable-ABI wheels for CPython 3.12+. Free-threaded builds cannot use it, and
# enabling it for them makes cross-compiles fall back to the host interpreter.
abi3 = ["pyo3/abi3-py312"]

[lib]
name = "pysandbox_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
interprocess.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
pysandbox-protocol = { path = "../pysandbox-protocol" }
pysandbox-sandboxd = { path = "../pysandbox-sandboxd" }
tokio.workspace = true
