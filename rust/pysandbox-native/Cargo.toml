[package]
name = "pysandbox-native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["generate-runtime"]
generate-runtime = ["dep:pysandbox-runtime-build"]

[lib]
name = "pysandbox_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
interprocess.workspace = true
pyo3.workspace = true
pyo3-async-runtimes.workspace = true
pysandbox-protocol = { path = "../pysandbox-protocol" }
pysandbox-sandboxd = { path = "../pysandbox-sandboxd" }
tokio.workspace = true

[build-dependencies]
pysandbox-runtime-build = { path = "../pysandbox-runtime-build", optional = true }
