[project]
name = "pysandbox-wasi"
version = "1.4.0"
description = "A Wasmtime-backed Python sandbox with RPC support."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "t8945", email = "123198477+AGitUser0001@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["sandbox", "python", "wasm", "wasi", "wasmtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "build>=1.3",
    "cbor2>=6",
    "installer>=0.7",
    "packaging>=24",
    "platformdirs>=4",
    "resolvelib>=1.1",
]

[project.urls]
Homepage = "https://github.com/AGitUser0001/pysandbox"
Repository = "https://github.com/AGitUser0001/pysandbox"
Issues = "https://github.com/AGitUser0001/pysandbox/issues"

[build-system]
requires = [
    "componentize-py",
    "maturin>=1.14.1,<2",
]
build-backend = "maturin"

[dependency-groups]
dev = [
  "componentize-py",
  "ruff",
]

[tool.maturin]
manifest-path = "rust/pysandbox-native/Cargo.toml"
module-name = "pysandbox._core"
python-source = "."
include = [
    { path = "pysandbox.wasm", from = "out-dir", to = "pysandbox/_runtime/", crate-name = "pysandbox-native" },
    { path = "runtime/**/*", from = "out-dir", to = "pysandbox/_runtime/", crate-name = "pysandbox-native" },
    { path = "component/**/*", format = "sdist" },
    { path = "vendor/cbor2/cbor2/**/*", format = "sdist" },
    { path = "vendor/cbor2/pyproject.toml", format = "sdist" },
    { path = "vendor/cpython/Lib/**/*", format = "sdist" },
    { path = "vendor/cpython/LICENSE", format = "sdist" },
    { path = "vendor/eryx-vfs/**/*", format = "sdist" },
]

[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "release"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.12"
exclude = [
    ".venv",
    "component",
    "pysandbox/_runtime",
    "target",
    "tmp",
    "vendor",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.ruff]
indent-width = 2
extend-exclude = ["pysandbox/_runtime", "vendor"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["B010", "BLE001"]
