[project]
name = "pysandbox-wasi"
version = "1.6.6"
description = "A Wasmtime-backed Python sandbox with RPC support."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "t8945", email = "123198477+AGitUser0001@users.noreply.github.com" },
]
requires-python = ">=3.12"
keywords = ["sandbox", "python", "wasm", "wasi", "wasmtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "build[virtualenv]>=1.3",
    "cbor2>=6",
    "installer>=0.7",
    "packaging>=24",
    "platformdirs>=4",
    "pysandbox-wasi-core==1.6.6",
    "resolvelib>=1.1",
]

[project.urls]
Homepage = "https://github.com/AGitUser0001/pysandbox"
Repository = "https://github.com/AGitUser0001/pysandbox"
Issues = "https://github.com/AGitUser0001/pysandbox/issues"

[build-system]
requires = [
    "componentize-py",
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv.sources]
pysandbox-wasi-core = { path = "rust/pysandbox-native" }

[dependency-groups]
dev = [
  "componentize-py",
  "hatchling",
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
timeout = 180

[tool.hatch.build.targets.wheel]
packages = ["pysandbox"]
artifacts = ["pysandbox/_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/pysandbox",
    "/component",
    "/rust",
    "/vendor/cbor2/cbor2",
    "/vendor/cbor2/pyproject.toml",
    "/vendor/cpython/Lib",
    "/vendor/cpython/LICENSE",
    "/vendor/eryx-vfs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/hatch_build.py",
]
exclude = ["/component/pysandbox.wasm", "/pysandbox/_runtime"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
extraPaths = ["rust/pysandbox-native"]
reportMissingModuleSource = "none"
pythonVersion = "3.12"
exclude = [
    ".venv",
    "component",
    "pysandbox/_runtime",
    "target",
    "tmp",
    "vendor",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.ruff]
indent-width = 2
extend-exclude = ["pysandbox/_runtime", "vendor"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["B010", "BLE001"]
