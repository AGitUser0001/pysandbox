[project]
name = "pysandbox"
version = "0.4.7.2"
description = "A Wasmtime-backed Python sandbox with RPC support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=6",
]

[build-system]
requires = [
    "componentize-py",
    "maturin>=1.10,<2",
]
build-backend = "maturin"

[dependency-groups]
dev = [
    "componentize-py",
]

[tool.maturin]
manifest-path = "rust/pysandbox-native/Cargo.toml"
module-name = "pysandbox._core"
python-source = "."
include = [
    { path = "pysandbox.wasm", from = "out-dir", to = "pysandbox/_runtime/", crate-name = "pysandbox-native" },
    { path = "runtime/**/*", from = "out-dir", to = "pysandbox/_runtime/", crate-name = "pysandbox-native" },
    { path = "component/**/*", format = "sdist" },
    { path = "vendor/cbor2/cbor2/**/*", format = "sdist" },
    { path = "vendor/cbor2/pyproject.toml", format = "sdist" },
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [
    ".venv",
    "component",
    "target",
    "tmp",
    "vendor",
]

[tool.ruff]
indent-width = 2
extend-exclude = ["vendor"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["B010", "BLE001"]
