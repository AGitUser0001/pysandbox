[project]
name = "pysandbox"
version = "0.4.7.2"
description = "A Wasmtime-backed Python sandbox with RPC support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=6",
    "wasmtime>=47.0.1",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "componentize-py",
]

[tool.maturin]
manifest-path = "rust/pysandbox-native/Cargo.toml"
module-name = "pysandbox._core"
python-source = "."

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
indent-width = 2

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
extend-select = ["I", "RUF022"]
ignore = ["B010", "BLE001"]
